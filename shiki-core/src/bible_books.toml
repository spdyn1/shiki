# Livres de la Bible reconnus par shiki dans les notes ([bible] dans config.toml).
#
# Un bloc [[livre]] par livre, dans l'ordre canonique : le 1er est Genèse,
# le 66e Révélation. Ne pas en retirer ni en changer l'ordre — le numéro
# du livre (son rang ici) sert à retrouver le texte.
#
#   nom          nom affiché dans les citations (« Jean 3:16 ») ; il est
#                aussi toujours reconnu dans les notes.
#   citation     (facultatif) nom à afficher à la place de `nom`,
#                ex. « Psaume 83:18 » plutôt que « Psaumes 83:18 ».
#   abreviations autres formes reconnues dans les notes.
#
# À la comparaison, majuscules, accents, espaces et points sont ignorés :
# « Ré », « re » et « RÉ. » sont la même abréviation. Dans une note, une
# référence doit quand même commencer par une majuscule (« Le 19:18 » est
# le Lévitique, « le 8:15 » une heure). Une abréviation ne peut désigner
# qu'un seul livre.
#
# Les changements sont pris en compte au prochain lancement de shiki.


